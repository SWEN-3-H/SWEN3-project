spring.application.name=ocr-worker
spring.main.web-application-type=none
spring.main.keep-alive=true

logging.level.at.fhtw.ocrworker=INFO

app.rabbitmq.uri=${APP_RABBITMQ_URI}

app.minio.endpoint=${APP_MINIO_ENDPOINT}
app.minio.access-key=${MINIO_ROOT_USER}
app.minio.secret-key=${MINIO_ROOT_PASSWORD}
app.minio.bucket=documents

app.ocr.languages=deu+eng
app.ocr.timeout-seconds=120

app.indexing.confirm-timeout-seconds=10

spring.elasticsearch.uris=http://localhost:9200