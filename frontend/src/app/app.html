<mat-toolbar>
  <button mat-icon-button (click)="sidenav.toggle()" aria-label="Menü ein-/ausklappen">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Document Manager</span>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #sidenav mode="side" opened>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive #home="routerLinkActive"
         [routerLinkActiveOptions]="{ exact: true }" [activated]="home.isActive">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>

      <a mat-list-item routerLink="/documents" routerLinkActive #docs="routerLinkActive"
         [activated]="docs.isActive">
        <mat-icon matListItemIcon>description</mat-icon>
        <span matListItemTitle>Documents</span>
      </a>

      <a mat-list-item routerLink="/upload" routerLinkActive #upload="routerLinkActive"
         [activated]="upload.isActive">
        <mat-icon matListItemIcon>upload</mat-icon>
        <span matListItemTitle>Upload</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
