spring.application.name=documentmanager

#Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/documentmanager
spring.datasource.username=myuser
spring.datasource.password=mysecretpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

logging.level.at.fhtw.documentmanager=DEBUG
app.rabbitmq.uri=amqp://guest:guest@localhost:5672/%2f

#MinIO
app.minio.endpoint=http://localhost:9000
app.minio.access-key=${MINIO_ROOT_USER}
app.minio.secret-key=${MINIO_ROOT_PASSWORD}
app.minio.bucket=documents

spring.elasticsearch.uris=http://localhost:9200